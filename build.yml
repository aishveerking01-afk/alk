```yaml
name: Build Rui APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --org com.rui --project-name rui --platforms android .

      - name: Apply Rui manifest
        run: cp manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdk to 24
        run: sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle*

      - name: Define Kotlin version
        run: echo "kotlin_version=2.1.0" >> android/gradle.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Fix llamafu namespace
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys

          cache = os.path.expanduser("~/.pub-cache/hosted")
          matches = (
              glob.glob(cache + "/pub.dev/llamafu-*")
              + glob.glob(cache + "/pub.dartlang.org/llamafu-*")
          )

          if not matches:
              sys.exit("ERROR: llamafu was not found in the pub cache.")

          plugin = sorted(matches)[-1]
          gradle = os.path.join(plugin, "android", "build.gradle")

          if not os.path.isfile(gradle):
              sys.exit("ERROR: llamafu Android build.gradle was not found.")

          with open(gradle, encoding="utf-8") as f:
              content = f.read()

          namespace = "com.llamafu.llamafu"

          if re.search(r'\bnamespace\s*[=( ]', content):
              print("llamafu already declares a namespace.")
          else:
              pattern = r'(?m)^([ \t]*)android[ \t]*\{'
              updated, count = re.subn(
                  pattern,
                  lambda m: (
                      m.group(0)
                      + "\n"
                      + m.group(1)
                      + "    namespace '"
                      + namespace
                      + "'"
                  ),
                  content,
                  count=1,
              )

              if count == 0:
                  sys.exit(
                      "ERROR: Could not find android { in llamafu/build.gradle."
                  )

              with open(gradle, "w", encoding="utf-8") as f:
                  f.write(updated)

              print("Added namespace:", namespace)
              print("Patched:", gradle)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rui-apk
          path: rui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
```
