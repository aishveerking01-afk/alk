name: Build Rui APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --org com.rui --project-name rui --platforms android .

      - name: Apply Rui manifest
        run: cp manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdk to 24
        run: sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*

      - name: Define kotlin_version for llamafu
        run: echo "kotlin_version=2.1.0" >> android/gradle.properties

      - run: flutter pub get

      - name: Patch llamafu namespace
        run: |
          LF=$(ls -d $HOME/.pub-cache/hosted/pub.dev/llamafu-* | head -1)
          echo "Patching $LF"
          GRADLE="$LF/android/build.gradle"
          MANIFEST="$LF/android/src/main/AndroidManifest.xml"
          NS=""
          if [ -f "$MANIFEST" ]; then
            NS=$(grep -o 'package="[^"]*"' "$MANIFEST" | head -1 | cut -d'"' -f2)
            sed -i 's/ package="[^"]*"//' "$MANIFEST"
          fi
          NS=${NS:-com.llamafu.llamafu}
          echo "Using namespace: $NS"
          if ! grep -q "namespace" "$GRADLE"; then
            printf "\nandroid {\n    namespace '%s'\n}\n" "$NS" >> "$GRADLE"
          fi
          echo "---- patched build.gradle ----"
          cat -n "$GRADLE"
          echo "---- manifest ----"
          cat "$MANIFEST" || true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rui-apk
          path: rui/build/app/outputs/flutter-apk/app-release.apk
