name: Build Rui APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --org com.rui --project-name rui --platforms android .

      - name: Apply Rui manifest
        run: cp manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdk to 24
        run: sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*

      - name: Define kotlin_version for llamafu
        run: echo "kotlin_version=2.1.0" >> android/gradle.properties

      - run: flutter pub get

      - name: Patch llamafu
        run: |
          python3 - <<'PY'
          import glob, os, re

          lf = sorted(glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/llamafu-*')))[0]
          gradle = lf + '/android/build.gradle'
          manifest = lf + '/android/src/main/AndroidManifest.xml'
          ns = 'com.llamafu.llamafu'

          if os.path.exists(manifest):
              m = open(manifest).read()
              found = re.search(r'package="([^"]+)"', m)
              if found:
                  ns = found.group(1)
                  m = re.sub(r'\s+package="[^"]+"', '', m, count=1)
                  open(manifest, 'w').write(m)

          lines = open(gradle).read().split('\n')
          out = []
          done = False
          for line in lines:
              out.append(line)
              if not done and re.match(r'^\s*android\s*\{\s*$', line):
                  out.append("    namespace '%s'" % ns)
                  done = True
          if not done:
              out += ['', 'android {', "    namespace '%s'" % ns, '}']
          open(gradle, 'w').write('\n'.join(out))
          print('namespace:', ns, '| inserted into android block:', done)
          PY
          mkdir -p $HOME/.gradle/init.d
          cat > $HOME/.gradle/init.d/namespace.gradle <<'EOF'
          allprojects {
              afterEvaluate { }
              plugins.withId('com.android.library') {
                  if (project.name == 'llamafu') {
                      def ext = project.extensions.findByName('android')
                      if (ext != null && !ext.namespace) {
                          ext.namespace = 'com.llamafu.llamafu'
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          flutter build apk --release || {
            echo "=========== LLAMAFU build.gradle ==========="
            cat -n $(ls -d $HOME/.pub-cache/hosted/pub.dev/llamafu-* | head -1)/android/build.gradle
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rui-apk
          path: rui/build/app/outputs/flutter-apk/app-release.apk
