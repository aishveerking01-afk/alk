name: Build Rui APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --org com.rui --project-name rui --platforms android .

      - name: Apply Rui manifest
        run: cp manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdk to 24
        run: sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*

      - name: Define kotlin_version for llamafu
        run: echo "kotlin_version=2.1.0" >> android/gradle.properties

      - run: flutter pub get

      - name: Patch llamafu namespace
        run: |
          LF=$(ls -d $HOME/.pub-cache/hosted/pub.dev/llamafu-* | head -1)
          M="$LF/android/src/main/AndroidManifest.xml"
          NS=""
          if [ -f "$M" ]; then
            NS=$(grep -o 'package="[^"]*"' "$M" | head -1 | cut -d'"' -f2)
            sed -i 's/ package="[^"]*"//' "$M"
          fi
          NS=${NS:-com.llamafu.llamafu}
          echo "Namespace: $NS"
          echo "---- llamafu build.gradle: namespace/android lines ----"
          grep -n "namespace\|android *{" "$LF/android/build.gradle" || true
          echo "---- llamafu build.gradle: first 40 lines ----"
          head -40 "$LF/android/build.gradle"
          mkdir -p $HOME/.gradle/init.d
          cat > $HOME/.gradle/init.d/namespace.gradle <<EOF
          allprojects {
              afterEvaluate { p ->
                  if (p.name == 'llamafu' && p.extensions.findByName('android') != null) {
                      def ext = p.extensions.findByName('android')
                      if (ext.namespace == null || ext.namespace.toString().isEmpty()) {
                          ext.namespace = '$NS'
                      }
                  }
              }
          }
          EOF
          echo "---- init script ----"
          cat $HOME/.gradle/init.d/namespace.gradle

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rui-apk
          path: rui/build/app/outputs/flutter-apk/app-release.apk
