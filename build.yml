name: Build Rui APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --org com.rui --project-name rui --platforms android .

      - name: Apply Rui manifest
        run: cp manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdk to 24
        run: sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*

      - name: Define kotlin_version for llamafu
        run: echo "kotlin_version=2.1.0" >> android/gradle.properties

      - run: flutter pub get

      - name: Patch llamafu namespace
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          lf = sorted(glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/llamafu-*')))[0]
          gradle = lf + '/android/build.gradle'
          manifest = lf + '/android/src/main/AndroidManifest.xml'
          ns = 'com.llamafu.llamafu'

          if os.path.exists(manifest):
              m = open(manifest).read()
              found = re.search(r'package="([^"]+)"', m)
              if found:
                  ns = found.group(1)
                  m = re.sub(r'\s+package="[^"]+"', '', m, count=1)
                  open(manifest, 'w').write(m)

          s = open(gradle).read()
          block = re.search(r'\bandroid\s*\{', s)
          if block:
              s = s[:block.end()] + "\n    namespace '%s'" % ns + s[block.end():]
          else:
              s += "\nandroid {\n    namespace '%s'\n}\n" % ns
          open(gradle, 'w').write(s)

          check = open(gradle).read()
          if "namespace '%s'" % ns not in check:
              print('PATCH FAILED')
              sys.exit(1)
          print('Patched', gradle, 'with namespace', ns)
          print(check)
          PY

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rui-apk
          path: rui/build/app/outputs/flutter-apk/app-release.apk
