name: Build Rui APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: flutter create --org com.rui --project-name rui --platforms android .

      - name: Apply Rui manifest
        run: cp manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdk to 24
        run: sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rui-apk
          path: rui/build/app/outputs/flutter-apk/app-release.apk
