```yaml
name: Build Rui APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check project
        working-directory: rui
        run: |
          test -f pubspec.yaml
          flutter create --org com.rui --project-name rui --platforms android .
          cp manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minimum SDK
        working-directory: rui
        run: sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle*

      - name: Get dependencies
        working-directory: rui
        run: flutter pub get

      - name: Fix llamafu namespace
        working-directory: rui
        shell: bash
        run: |
          set -e
          FILE=$(find "$HOME/.pub-cache/hosted" \
            -path '*/llamafu-*/android/build.gradle' \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: llamafu Gradle file not found"
            exit 1
          fi

          echo "Patching $FILE"

          python3 - "$FILE" <<'PY'
          import re, sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              text = f.read()

          if not re.search(r'(?m)^\s*namespace\s+', text):
              text, count = re.subn(
                  r'(?m)^([ \t]*)android\s*\{',
                  lambda m: m.group(0) + "\n" + m.group(1) +
                            "    namespace 'com.llamafu.llamafu'",
                  text, count=1
              )
              if count != 1:
                  sys.exit("ERROR: Could not locate android { block")

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

          with open(path, encoding="utf-8") as f:
              text = f.read()

          if not re.search(r'(?m)^\s*namespace\s+', text):
              sys.exit("ERROR: Namespace insertion failed")

          print("Namespace verified: com.llamafu.llamafu")
          PY

      - name: Build APK
        working-directory: rui
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rui-APK
          path: rui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
```
