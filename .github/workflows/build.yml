
      - name: Fix Android POSIX memory advice constants
        shell: bash
        run: |
          set -e

          LLAMA_MMAP="$HOME/.pub-cache/hosted/llama.cpp/src/llama-mmap.cpp"

          if [ ! -f "$LLAMA_MMAP" ]; then
            echo "ERROR: llama-mmap.cpp not found at $LLAMA_MMAP"
            find "$HOME/.pub-cache/hosted" -path '*/src/llama-mmap.cpp' -print
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path.home() / ".pub-cache/hosted/llama.cpp/src/llama-mmap.cpp"
          source = p.read_text()

          compatibility = """
          // Compatibility definitions for Android NDK.
          #ifndef POSIX_MADV_RANDOM
          #define POSIX_MADV_RANDOM 1
          #endif
          #ifndef POSIX_MADV_WILLNEED
          #define POSIX_MADV_WILLNEED 3
          #endif

          """

          if "Compatibility definitions for Android NDK." not in source:
              marker = "// TODO: consider moving to llama-impl.h if needed in more places"
              if marker not in source:
                  raise SystemExit("ERROR: Could not find a safe insertion point.")
              source = source.replace(marker, compatibility + marker, 1)
              p.write_text(source)

          print("Android POSIX compatibility patch applied.")
          PY

          # Remove cached native build files so CMake reconfigures.
          find "$HOME/.pub-cache/hosted/pub.dev/llamafu-0.1.0/android" \
            -type d -name .cxx -prune -exec rm -rf {} +
