name: Build New Rui APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install compatible Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          cache: true

      - name: Repair Android project
        working-directory: rui
        shell: bash
        run: |
          set -e
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            rm -rf android
            flutter create --platforms=android --org com.aishveer.rui .
          fi

      - name: Get dependencies
        working-directory: rui
        run: flutter pub get

      - name: Fix llamafu Gradle configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"
          files = list(root.glob("llamafu-*/android/build.gradle"))
          if not files:
              raise SystemExit("ERROR: llamafu Gradle file not found")

          for file in files:
              text = file.read_text()

              if not re.search(r'(?m)^\s*namespace\s+', text):
                  text, count = re.subn(
                      r'(?m)^(\s*android\s*\{)',
                      r"\1\n    namespace 'com.example.llamafu'",
                      text,
                      count=1
                  )
                  if count == 0:
                      raise SystemExit("Could not add llamafu namespace")

              text = re.sub(r'\$kotlin_version\b', '1.9.24', text)
              text = re.sub(r'\bkotlin_version\b', "'1.9.24'", text)
              file.write_text(text)
              print("Patched:", file)
          PY

      - name: Fix Rui Dart source
        working-directory: rui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("lib/main.dart")
          text = file.read_text()

          old = "final result = await engine.multimodalComplete(\n        prompt,"
          new = "final result = await engine.multimodalComplete(\n        prompt: prompt,"

          if old in text:
              text = text.replace(old, new, 1)
              file.write_text(text)
              print("Fixed multimodalComplete prompt argument.")
          elif new in text:
              print("multimodalComplete prompt argument already fixed.")
          else:
              raise SystemExit("ERROR: Could not find multimodalComplete call.")

          print("Source patch complete.")
          PY

      - name: Build release APK
        working-directory: rui
        run: flutter build apk --release

      - name: Upload new Rui APK
        uses: actions/upload-artifact@v4
        with:
          name: NEW-Rui-APK
          path: rui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
