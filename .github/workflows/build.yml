name: Build New Rui APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Android project files
        working-directory: rui
        shell: bash
        run: |
          set -e

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Repairing missing Android project files..."
            rm -rf android
            flutter create --platforms=android --org com.aishveer.rui .
          fi

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android Gradle files were not generated."
            exit 1
          fi

      - name: Get Flutter dependencies
        working-directory: rui
        run: flutter pub get

      - name: Fix llamafu namespace
        working-directory: rui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          plugins = list(cache.glob("llamafu-*/android/build.gradle"))

          if not plugins:
              raise SystemExit("llamafu Android Gradle file not found")

          for file in plugins:
              content = file.read_text()
              if not re.search(r'(?m)^\s*namespace\s+', content):
                  content, count = re.subn(
                      r'(?m)^(\s*android\s*\{)',
                      r"\1\n    namespace 'com.example.llamafu'",
                      content,
                      count=1
                  )
                  if count == 0:
                      raise SystemExit("Could not patch llamafu namespace")
                  file.write_text(content)
              print("Checked:", file)
          PY

      - name: Build release APK
        working-directory: rui
        run: flutter build apk --release

      - name: Upload NEW Rui APK
        uses: actions/upload-artifact@v4
        with:
          name: NEW-Rui-APK
          path: rui/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
